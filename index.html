<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzt5pERFAp0dVLNcqZQPBohgtghZkFU5B2hj5azb_HFBntyjz02TwUaCwpd1U_HDFyN/exec";

function fmtMoney(n) {
  return Number(n || 0).toLocaleString("en-US", {
    style: "currency",
    currency: "USD"
  });
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString("en-US");
}

function rankClass(index) {
  if (index === 0) return "gold";
  if (index === 1) return "silver";
  if (index === 2) return "bronze";
  return "neutral";
}

function rowIcon(index) {
  const icons = ["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"];
  return icons[index] || (index + 1);
}

function renderDashboard(data) {

  const weekend = data.weekend || [];
  const reviews = data.reviews || [];
  const supplemental = data.supplemental || [];
  const accountability = data.accountability || [];

  // KPI TOTALS
  const totalWeekendPremium = weekend.reduce((a,b) => a + Number(b.premium || 0), 0);
  const totalAnnual = supplemental.reduce((a,b) => a + Number(b.annual || 0), 0);
  const totalPolicies = supplemental.reduce((a,b) => a + Number(b.policies || 0), 0);

  document.getElementById("kpiPremium").textContent = fmtMoney(totalWeekendPremium);
  document.getElementById("kpiAnnual").textContent = fmtMoney(totalAnnual);
  document.getElementById("kpiPolicies").textContent = fmtNum(totalPolicies);

  // WEEKEND
  document.querySelector("#weekendTable tbody").innerHTML =
    weekend.map((item,index) => `
      <tr>
        <td>
          <span class="rank ${rankClass(index)}">
            ${rowIcon(index)}
          </span>
        </td>
        <td>${item.agent}</td>
        <td class="money">${fmtMoney(item.premium)}</td>
      </tr>
    `).join("");

  // REVIEWS
  document.querySelector("#reviewsTable tbody").innerHTML =
    reviews.map((item,index) => `
      <tr>
        <td>
          <span class="rank ${rankClass(index)}">
            ${rowIcon(index)}
          </span>
        </td>
        <td>${item.agent}</td>
        <td class="score">${fmtNum(item.reviews)}</td>
      </tr>
    `).join("");

  // SUPPLEMENTAL
  document.querySelector("#ciTable tbody").innerHTML =
    supplemental.map((item,index) => `
      <tr>
        <td>
          <span class="rank ${rankClass(index)}">
            ${index + 1}
          </span>
        </td>
        <td>${item.agent}</td>
        <td class="score">${fmtNum(item.policies)}</td>
        <td class="money">${fmtMoney(item.premium)}</td>
        <td class="money">${fmtMoney(item.annual)}</td>
      </tr>
    `).join("");

  // ACCOUNTABILITY
  document.querySelector("#accountabilityTable tbody").innerHTML =
    accountability.map((item,index) => `
      <tr>
        <td>
          <span class="rank ${rankClass(index)}">
            ${index + 1}
          </span>
        </td>
        <td>${item.team}</td>
        <td class="score">${fmtNum(item.total)}</td>
      </tr>
    `).join("");
}

function showError() {
  document.getElementById("kpiPremium").textContent = "Error";
  document.getElementById("kpiAnnual").textContent = "Error";
  document.getElementById("kpiPolicies").textContent = "Error";
}

function loadDashboard() {

  const callbackName = "dashboardCallback_" + Date.now();

  window[callbackName] = function(data) {
    renderDashboard(data);

    delete window[callbackName];
    script.remove();
  };

  const script = document.createElement("script");

  script.src =
    API_URL +
    "?callback=" +
    callbackName +
    "&t=" +
    Date.now();

  script.onerror = function() {
    showError();
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

loadDashboard();

setInterval(loadDashboard, 60000);
</script>
