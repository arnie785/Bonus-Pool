<script>
  const API_URL = "https://script.googleusercontent.com/a/macros/thebenefitsboss.com/echo?user_content_key=AUkAhnQsuGT8PBYo7A-YS2p2qx20vzqiM1io0hNer-krBersGdBRKuUMmT9nk_TO5Yt7Y1iKivMbNDLXH6R3ftRBbp7U39iDkVHRMXHi0_MqeF3A1DMzXIw7D1xNi67Py4ftR1So58HZrcsM3HbS2WmrIxC_zG5I5h-gYZ3ugBETLziPUWZvVVFCRz05dX3G6p80unmyc_1DPx3UYWCquUqpzy-zrR3G_zQTJpIAb38r34eersrCaZy_tF-aDeJBvcAuRcEmbf5nUhIdWAAz05xmeeA1bJfn47_ixnnjomZG5QwWYb27ZuY&lib=MZoteHgRpv6G9lB5fK1uR8LHw7bdhDzKy";

  function fmtMoney(n) {
    return Number(n || 0).toLocaleString("en-US", { style: "currency", currency: "USD" });
  }

  function fmtNum(n) {
    return Number(n || 0).toLocaleString("en-US");
  }

  function rankClass(index) {
    if (index === 0) return "gold";
    if (index === 1) return "silver";
    if (index === 2) return "bronze";
    return "neutral";
  }

  function rowIcon(index) {
    const icons = ["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"];
    return icons[index] || String(index + 1);
  }

  function emptyRow(colspan, message) {
    return '<tr class="empty-row"><td colspan="' + colspan + '">' + message + '</td></tr>';
  }

  function renderDashboard(data) {
    const weekend = data?.sections?.weekend?.rows || [];
    const reviews = data?.sections?.reviews?.rows || [];
    const supplemental = data?.sections?.supplemental?.rows || [];
    const accountability = data?.sections?.accountability?.rows || [];
    const allstate = data?.sections?.allstate?.rows || [];

    const totalWeekendPremium = data?.stats?.totalWeekendPremium ?? weekend.reduce(function(sum, row) {
      return sum + Number(row.premium || 0);
    }, 0);

    const totalAnnual = data?.stats?.totalCAnnual ?? supplemental.reduce(function(sum, row) {
      return sum + Number(row.annual || 0);
    }, 0);

    const totalPolicies = data?.stats?.totalPolicies ?? supplemental.reduce(function(sum, row) {
      return sum + Number(row.policies || 0);
    }, 0);

    document.getElementById("titleText").textContent = data?.meta?.title || "BONUS POOL";
    document.getElementById("subtitleText").textContent = data?.meta?.subtitle || "Weekend Weekly and Monthly Bonus";
    document.getElementById("footerText").textContent = data?.meta?.footerMessage || "Great work team! Keep the momentum going and aim higher every weekend!";

    document.getElementById("weekendTitle").textContent = data?.sections?.weekend?.title || "1. Weekend Bonus";
    document.getElementById("reviewsTitle").textContent = data?.sections?.reviews?.title || "2. Google Reviews Contest";
    document.getElementById("suppTitle").textContent = data?.sections?.supplemental?.title || "3. Critical Illness — Supplemental";
    document.getElementById("acctTitle").textContent = data?.sections?.accountability?.title || "4. Accountability Partner";

    const allstateTitleEl = document.getElementById("allstateTitle");
    if (allstateTitleEl) {
      allstateTitleEl.textContent = data?.sections?.allstate?.title || "5. Allstate Production Summary";
    }

    document.getElementById("kpiPremium").textContent = fmtMoney(totalWeekendPremium);
    document.getElementById("kpiAnnual").textContent = fmtMoney(totalAnnual);
    document.getElementById("kpiPolicies").textContent = fmtNum(totalPolicies);

    document.querySelector("#weekendTable tbody").innerHTML = weekend.length
      ? weekend.map(function(item, index) {
          return (
            '<tr>' +
              '<td><span class="rank ' + rankClass(index) + '">' + rowIcon(index) + '</span></td>' +
              '<td>' + (item.agent || "") + '</td>' +
              '<td class="money">' + fmtMoney(item.premium) + '</td>' +
            '</tr>'
          );
        }).join("")
      : emptyRow(3, "No weekend data available.");

    document.querySelector("#reviewsTable tbody").innerHTML = reviews.length
      ? reviews.map(function(item, index) {
          return (
            '<tr>' +
              '<td><span class="rank ' + rankClass(index) + '">' + rowIcon(index) + '</span></td>' +
              '<td>' + (item.agent || "") + '</td>' +
              '<td class="score">' + fmtNum(item.reviews) + '</td>' +
            '</tr>'
          );
        }).join("")
      : emptyRow(3, "No review data available.");

    document.querySelector("#ciTable tbody").innerHTML = supplemental.length
      ? supplemental.map(function(item, index) {
          return (
            '<tr>' +
              '<td><span class="rank ' + rankClass(index) + '">' + (index + 1) + '</span></td>' +
              '<td>' + (item.agent || "") + '</td>' +
              '<td class="score">' + fmtNum(item.policies) + '</td>' +
              '<td class="money">' + fmtMoney(item.premium) + '</td>' +
              '<td class="money">' + fmtMoney(item.annual) + '</td>' +
            '</tr>'
          );
        }).join("")
      : emptyRow(5, "No supplemental data available.");

    document.querySelector("#accountabilityTable tbody").innerHTML = accountability.length
      ? accountability.map(function(item, index) {
          return (
            '<tr>' +
              '<td><span class="rank ' + rankClass(index) + '">' + (index + 1) + '</span></td>' +
              '<td>' + (item.team || "") + '</td>' +
              '<td class="score">' + fmtNum(item.total) + '</td>' +
            '</tr>'
          );
        }).join("")
      : emptyRow(3, "No accountability data available.");

    const allstateTableBody = document.querySelector("#allstateTable tbody");
    if (allstateTableBody) {
      allstateTableBody.innerHTML = allstate.length
        ? allstate.map(function(item, index) {
            return (
              '<tr>' +
                '<td><span class="rank ' + rankClass(index) + '">' + (index + 1) + '</span></td>' +
                '<td>' + (item.agent || "") + '</td>' +
                '<td class="score">' + fmtNum(item.policycount) + '</td>' +
                '<td class="money">' + fmtMoney(item.monthlypremium) + '</td>' +
                '<td class="money">' + fmtMoney(item.annualizedpremium) + '</td>' +
              '</tr>'
            );
          }).join("")
        : emptyRow(5, "No Allstate data available.");
    }
  }

  function showError(message) {
    document.getElementById("kpiPremium").textContent = "Error";
    document.getElementById("kpiAnnual").textContent = "Error";
    document.getElementById("kpiPolicies").textContent = "Error";

    document.querySelector("#weekendTable tbody").innerHTML = emptyRow(3, message);
    document.querySelector("#reviewsTable tbody").innerHTML = emptyRow(3, message);
    document.querySelector("#ciTable tbody").innerHTML = emptyRow(5, message);
    document.querySelector("#accountabilityTable tbody").innerHTML = emptyRow(3, message);

    const allstateTableBody = document.querySelector("#allstateTable tbody");
    if (allstateTableBody) {
      allstateTableBody.innerHTML = emptyRow(5, message);
    }
  }

  function loadDashboard() {
    const callbackName = "dashboardCallback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");

    window[callbackName] = function(data) {
      try {
        renderDashboard(data);
      } finally {
        delete window[callbackName];
        script.remove();
      }
    };

    script.src = API_URL + "?mode=api&callback=" + callbackName + "&t=" + Date.now();
    script.onerror = function() {
      delete window[callbackName];
      showError("API Error — check deployment / URL.");
      script.remove();
    };

    document.body.appendChild(script);
  }

  window.addEventListener("DOMContentLoaded", function() {
    loadDashboard();
    setInterval(loadDashboard, 60000);
  });
</script>
