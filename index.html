<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonus Pool Dashboard</title>
  <style>
    :root {
      --bg: #081421;
      --panel: rgba(16, 32, 51, 0.92);
      --panel-2: rgba(10, 18, 30, 0.96);
      --line: rgba(255,255,255,0.09);
      --text: #f8fafc;
      --muted: #9fb0c7;
      --teal: #18d1c8;
      --blue: #4a8dff;
      --purple: #a66bff;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --shadow: 0 20px 50px rgba(0,0,0,.38);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(24,209,200,.14), transparent 24%),
        radial-gradient(circle at top right, rgba(166,107,255,.12), transparent 26%),
        linear-gradient(180deg, #09111a 0%, #081421 100%);
      padding: 24px;
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
    }

    .topbar {
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .hero,
    .kpis,
    .card,
    .footer {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 22px 24px;
      display:flex;
      gap:18px;
      align-items:center;
      min-height: 132px;
    }

    .badge {
      width: 74px;
      height: 74px;
      display:grid;
      place-items:center;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,204,77,.18), rgba(255,204,77,.05));
      border: 1px solid rgba(255,204,77,.24);
      font-size: 42px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.02;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .sub strong {
      color: var(--teal);
    }

    .kpis {
      padding: 16px;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .kpi {
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      display:flex;
      gap: 14px;
      align-items:center;
      min-height: 106px;
    }

    .kpiIcon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display:grid;
      place-items:center;
      font-size: 24px;
      flex: 0 0 auto;
    }

    .kpi:nth-child(1) .kpiIcon {
      background: rgba(24,209,200,.14);
    }

    .kpi:nth-child(2) .kpiIcon {
      background: rgba(74,141,255,.14);
    }

    .kpi:nth-child(3) .kpiIcon {
      background: rgba(166,107,255,.14);
    }

    .kpiLabel {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 4px;
    }

    .kpiValue {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.05;
    }

    .toolbar {
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 12px;
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: .95rem;
    }

    .btn {
      appearance:none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn:hover {
      background: rgba(255,255,255,.08);
    }

    .grid {
      display:grid;
      grid-template-columns: 1.1fr 0.75fr 1.55fr;
      gap: 14px;
      align-items: stretch;
    }

    .card {
      overflow:hidden;
    }

    .cardHeader {
      padding: 16px 18px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .02em;
      display:flex;
      align-items:center;
      gap:10px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
    }

    .cardHeader.teal {
      background: linear-gradient(90deg, rgba(24,209,200,.22), rgba(24,209,200,.08));
    }

    .cardHeader.blue {
      background: linear-gradient(90deg, rgba(74,141,255,.22), rgba(74,141,255,.08));
    }

    .cardHeader.purple {
      background: linear-gradient(90deg, rgba(166,107,255,.24), rgba(166,107,255,.09));
    }

    .cardHeader .ico {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      color:#fff;
    }

    .table {
      width:100%;
      border-collapse: collapse;
    }

    .table thead th {
      text-align:left;
      padding: 14px 16px;
      font-size: .92rem;
      color: #bed2ee;
      background: rgba(255,255,255,.035);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
    }

    .table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 1rem;
      white-space: nowrap;
    }

    .table input {
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 6px 8px;
      font: inherit;
      outline: none;
    }

    .table input:focus {
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.04);
    }

    .rank {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:34px;
      height:34px;
      border-radius: 12px;
      font-weight:800;
      color:#09111a;
      background: #dfe8f4;
    }

    .rank.gold {
      background: var(--gold);
    }

    .rank.silver {
      background: var(--silver);
    }

    .rank.bronze {
      background: var(--bronze);
    }

    .rank.neutral {
      background: rgba(24,209,200,.14);
      color: var(--teal);
    }

    .money,
    .score {
      font-variant-numeric: tabular-nums;
      text-align:right;
      font-weight:700;
    }

    .money {
      color:#79efe9;
    }

    .score {
      color:#7ab1ff;
    }

    .footer {
      margin-top: 18px;
      padding: 18px 22px;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      min-height:90px;
      background: linear-gradient(90deg, rgba(24,209,200,.11), rgba(74,141,255,.11));
    }

    @media (max-width: 1200px) {
      .topbar,
      .grid,
      .kpis {
        grid-template-columns: 1fr;
      }

      body {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

<div class="wrap">

  <section class="topbar">

    <div class="hero">
      <div class="badge">🏆</div>
      <div>
        <h1>Bonus Pool</h1>
        <div class="sub">Weekend Bonus <strong>May 15–17</strong></div>
      </div>
    </div>

    <div class="kpis">

      <div class="kpi">
        <div class="kpiIcon">👤</div>
        <div>
          <div class="kpiLabel">Total Premium</div>
          <div class="kpiValue" id="kpiPremium">$0</div>
        </div>
      </div>

      <div class="kpi">
        <div class="kpiIcon">🛡️</div>
        <div>
          <div class="kpiLabel">Total Annual (x12)</div>
          <div class="kpiValue" id="kpiAnnual">$0</div>
        </div>
      </div>

      <div class="kpi">
        <div class="kpiIcon">👥</div>
        <div>
          <div class="kpiLabel">Total Policies</div>
          <div class="kpiValue" id="kpiPolicies">0</div>
        </div>
      </div>

    </div>

  </section>

  <div class="toolbar">
    <div>Tip: edit the values directly in the tables. Totals update instantly.</div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" onclick="saveState()">Save Changes</button>
      <button class="btn" onclick="resetState()">Reset Defaults</button>
    </div>
  </div>

  <section class="grid">

    <article class="card">
      <div class="cardHeader teal">
        <span class="ico" style="background:#18d1c8;">🏆</span>
        1. Weekend Bonus May 15–17
      </div>

      <table class="table" id="weekendTable">
        <thead>
          <tr>
            <th style="width:24%;">#</th>
            <th>Agent</th>
            <th style="width:42%; text-align:right;">Premium</
